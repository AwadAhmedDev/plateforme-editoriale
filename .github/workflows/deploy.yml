name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Un seul deploiement de production a la fois. `cancel-in-progress: false` :
# un deploiement en cours applique peut-etre deja des migrations, il ne doit
# jamais etre interrompu a mi-parcours par un push suivant.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Rejoue integralement la verification de ci.yml — jamais une copie divergente.
  verifier:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deployer:
    needs: verifier
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      # DIRECT_URL exclusivement (connexion directe port 5432) : les migrations
      # ne passent jamais par la connexion poolee Supavisor. `migrate deploy`
      # n'applique que des migrations deja versionnees, ne genere jamais de SQL
      # et ne reinitialise jamais la base.
      #
      # Place AVANT le deploiement : le nouveau code ne doit jamais atteindre la
      # production devant un schema qui ne l'accompagne pas. Un echec ici arrete
      # le job et rien n'est mis en ligne.
      - name: Appliquer les migrations de base de donnees
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Deploiement Vercel
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
