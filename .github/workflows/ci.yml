name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Rend ce workflow appelable par deploy.yml (jobs.<id>.uses) : la verification
  # est ecrite une seule fois et rejouee a l'identique avant chaque deploiement.
  workflow_call:

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Aucun champ "engines" dans package.json : la version est epinglee ici,
      # alignee sur le runtime de developpement (Node 22).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      # package.json n'a aucun script postinstall : sur une installation propre,
      # le client Prisma n'existe pas et `next build` echoue. L'etape est donc
      # explicite. prisma.config.ts lit DIRECT_URL via env(), qui leve si absente.
      - name: Generer le client Prisma
        run: npx prisma generate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Verification des types
        run: npx tsc --noEmit

      # Non bloquant tant que les erreurs preexistantes ne sont pas traitees.
      # Passer a `continue-on-error: false` des qu'elles le sont.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # DATABASE_URL est requise au BUILD et pas seulement au runtime : "/" et
      # "/sitemap.xml" sont prerendues statiquement et interrogent la base.
      # R2_PUBLIC_URL est lue par next.config.ts pour images.remotePatterns ;
      # sans elle le build reussit mais next/image refuse les images R2.
      # SITE_URL est obligatoire hors developpement (src/lib/site-url.ts leve).
      - name: Build de production
        run: npm run build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
