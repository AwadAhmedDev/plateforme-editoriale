name: CI

# Types, lint et tests unitaires, sans base ni secret. Le build de production n'est pas
# rejoue ici : il prerend des pages (plan du site) qui lisent la base, et Hostinger le
# construit a chaque push sur master avec les variables reelles.
#
# Les migrations ne sont jamais appliquees depuis GitHub Actions : apres en avoir ajoute
# une, la lancer a la main (`npx prisma migrate deploy`, voir README).

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Aucun champ "engines" dans package.json : la version est epinglee ici,
      # alignee sur le runtime de developpement (Node 22).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      # Indispensable AVANT `tsc` : 14 fichiers de src/ importent @prisma/client,
      # dont les types n'existent pas tant que le client n'est pas genere.
      # `generate` ne se connecte jamais a la base ; prisma.config.ts exige
      # seulement que DIRECT_URL soit definie (env() leve si absente), d'ou cette
      # valeur factice — aucun secret GitHub n'est necessaire.
      - name: Generer le client Prisma
        run: npx prisma generate
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Verification des types
        run: npx tsc --noEmit

      # Bloquant : le code est sans erreur ni avertissement de lint.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Tests
        run: npm test
