name: CI

# Verification statique uniquement. Le build de production n'est plus rejoue ici :
# l'integration Git native de Vercel construit chaque pull request (preview) et
# chaque push sur master (production) avec les variables reelles de chaque
# environnement. Le dupliquer ici imposerait de repliquer SITE_URL, DATABASE_URL
# et R2_PUBLIC_URL en secrets GitHub sans rien verifier de plus.
#
# Les migrations ne sont jamais appliquees depuis GitHub Actions : elles sont
# jouees par le `buildCommand` de frontend/vercel.json, et uniquement quand
# VERCEL_ENV vaut "production".

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Aucun champ "engines" dans package.json : la version est epinglee ici,
      # alignee sur le runtime de developpement (Node 22).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      # Indispensable AVANT `tsc` : 14 fichiers de src/ importent @prisma/client,
      # dont les types n'existent pas tant que le client n'est pas genere.
      # `generate` ne se connecte jamais a la base ; prisma.config.ts exige
      # seulement que DIRECT_URL soit definie (env() leve si absente), d'ou cette
      # valeur factice — aucun secret GitHub n'est necessaire.
      - name: Generer le client Prisma
        run: npx prisma generate
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Verification des types
        run: npx tsc --noEmit

      # Non bloquant tant que les erreurs preexistantes ne sont pas traitees.
      # Passer a `continue-on-error: false` des qu'elles le sont.
      - name: Lint
        run: npm run lint
        continue-on-error: true
